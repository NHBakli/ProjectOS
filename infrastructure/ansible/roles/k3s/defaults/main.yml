---
# Ces verrous sont faux tant que la compatibilité et le filtrage ne sont pas prouvés.
k3s_install_approved: false
k3s_upgrade_approved: false
k3s_host_compatibility_verified: false
k3s_api_protection_verified: false
k3s_api_protection_evidence: ''

# Choisir ces valeurs après les essais réseau et la réponse du fournisseur.
k3s_flannel_backend: ''
k3s_api_bind_address: ''

# Plages internes K3s ; elles sont autorisées vers l'hôte dans UFW.
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16
k3s_manage_ufw_cluster_rules: true

# Entrée HTTP/HTTPS : Traefik et ServiceLB fournis par K3s, versions liées à
# k3s_version. Ports publics ouverts dans UFW (accord du 2026-10-31).
k3s_enable_ingress: true
k3s_ufw_ingress_ports:
  - '80'
  - '443'
# Les NodePorts sont publiés par DNAT et contournent UFW : les limiter à
# localhost. ServiceLB vise la ClusterIP de Traefik et n'en dépend pas.
k3s_nodeport_addresses: 127.0.0.1/32

# Binaire amd64 publié par le projet K3s et contrôlé par SHA-256.
k3s_version: v1.37.1+k3s1
k3s_binary_sha256: 92b94582eb7b34a8cf532e6006842b9ed215a6783cf56a3dd6271fd35243b2c0
