---
# Valeurs n8n pour la VM single-node. Aucun secret ni nom d'hôte réel :
# deploy-n8n.yml injecte l'hôte (ingress, URLs) depuis le fichier privé.
image:
  tag: '2.44.5'

queueMode:
  enabled: false

database:
  type: sqlite
  useExternal: false

redis:
  enabled: false

# SQLite sur un volume RWO : ne jamais faire tourner deux n8n en même temps.
strategy:
  type: Recreate

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  storageClassName: local-path

secretRefs:
  existingSecret: n8n-secrets

# Le chart crée sinon un token aléatoire même avec les runners désactivés.
taskRunners:
  enabled: false
  authToken:
    existingSecret: n8n-runner-secrets
    existingSecretKey: N8N_RUNNERS_AUTH_TOKEN

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: n8n-redirect-https@kubernetescrd
  hosts:
    - host: n8n.example.invalid
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: n8n-tls
      hosts:
        - n8n.example.invalid

editor:
  url: https://n8n.example.invalid/

webhook:
  enabled: true
  url: https://n8n.example.invalid/

config:
  timezone: Europe/Paris
  extraEnv:
    # Traefik est le seul proxy devant n8n.
    - name: N8N_PROXY_HOPS
      value: '1'

resources:
  main:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
