---
# Déployé par le contrôleur Helm intégré à K3s ; version épinglée dans
# helm/charts.lock.yaml.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: project-os
spec:
  repo: https://charts.jetstack.io
  chart: cert-manager
  version: v1.21.3
  targetNamespace: cert-manager
  createNamespace: true
  valuesContent: |-
    crds:
      enabled: true
      keep: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
