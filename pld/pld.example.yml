# Exemple de configuration du générateur de PLD. Aucune donnée réelle.
# Copier dans ~/.config/projectos/pld.yml (hors Git) puis adapter.
# Les noms des membres ne vont JAMAIS dans ce dépôt public.

plane:
  # url: "https://plane.exemple.fr"   # facultatif : sinon déduite de platform.yml
  espace: "mon-espace"
  projet_id: "00000000-0000-0000-0000-000000000000"

github:
  org: "Mon-Org"
  projets: [1, 2, 3]   # numéros des projets GitHub de l'organisation

pld:
  projet: "MonProjet"              # nom dans les fichiers : PLD_MonProjet_Sprint2.docx
  debut_par_defaut: "2026-10-01"   # début de période si --du est absent
  remise_suivante: "2026-12-01"    # fin de période si --au est absent
  membres:                         # pseudo GitHub -> nom affiché dans le PLD
    pseudo-exemple: "Prénom Nom"
  ignores: ["compte-externe"]      # membres de l'organisation hors équipe
  responsable: "Prénom Nom"         # descriptif du document (vide = « [À compléter] »)
  email: "equipe@exemple.fr"
  promotion: "2027"
  revisions:                       # révisions précédentes ; celle du PLD généré est ajoutée
    - {date: "05/10/2026", version: "1.0", auteurs: "Équipe", sections: "Toutes", commentaires: "PLD n°1"}
  textes:
    resume: "Deux phrases sur le projet. Le script ajoute les chiffres de la période."
    schema:                        # texte simple, ou {texte, tableau, image, note}
      tableau:
        - ["Entrée", "Service", "Résultat"]
        - ["Utilisateur", "Authentification", "Compte"]
      note: "Modules prévus plus tard."
    plan_alpha_beta: "Fonctionnalités à tester en alpha puis en bêta."
    # bloquants: "ajouté sous les points bloquants calculés"
    # commentaire: "ajouté sous le commentaire général calculé"
  # sortie: "~/projectos-pld/PLD"
  # modeles:
  #   docx: "~/Downloads/PLD_Template.docx"
  #   xlsx: "~/Downloads/PLD_Suivi_Taches.xlsx"
