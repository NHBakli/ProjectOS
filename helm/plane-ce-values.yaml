---
# Valeurs Plane Community Edition pour la VM single-node. Aucun secret ni nom
# d'hôte réel : ingress.appHost est injecté par deploy-plane.yml depuis le
# fichier privé (projectos_base_domain), les Secrets sont créés à part.
planeVersion: v1.4.2

ingress:
  enabled: true
  appHost: plane.example.invalid
  minioHost: ''
  rabbitmqHost: ''
  ingressClass: traefik

# Certificat fourni par cert-manager (Certificate plane-tls, letsencrypt-prod).
ssl:
  tls_secret_name: plane-tls
  createIssuer: false
  generateCerts: false

postgres:
  storageClass: local-path
  volumeSize: 10Gi

redis:
  storageClass: local-path
  volumeSize: 1Gi

rabbitmq:
  storageClass: local-path
  volumeSize: 1Gi

minio:
  storageClass: local-path
  volumeSize: 10Gi
  init_image: busybox:1.36.1

# Images épinglées par planeVersion : inutile de les retélécharger à chaque démarrage.
web:
  pullPolicy: IfNotPresent
space:
  pullPolicy: IfNotPresent
admin:
  pullPolicy: IfNotPresent
live:
  pullPolicy: IfNotPresent
api:
  pullPolicy: IfNotPresent
worker:
  pullPolicy: IfNotPresent
beatworker:
  pullPolicy: IfNotPresent

env:
  requireExplicitSecrets: true

external_secrets:
  app_keys_existingSecret: plane-app-keys
  app_env_existingSecret: plane-app-env
  live_env_existingSecret: plane-live-env
  doc_store_existingSecret: plane-doc-store
  pgdb_existingSecret: plane-postgres
  rabbitmq_existingSecret: plane-rabbitmq
